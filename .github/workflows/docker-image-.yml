name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker images
      run: | 
        docker build ./backend -t quiz-backend:$(date +%s)
        docker build ./frontend -t quiz-frontend:$(date +%s)
